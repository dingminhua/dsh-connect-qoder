name: dingminhua/dsh-connect-qoder
category: model
description:
  en: Connects Qoder (Lingma CN / international) models to DSH through their PATs, with per-region model management, a multi-account pool with daily check-in and automatic failover, and read-only credit readouts.
  zh: 通过 PAT 将 Qoder（通义灵码国内版 / 国际版）模型接入 DSH，支持按区域模型管理、带每日签到与自动换号的多账号池，以及只读积分展示。
