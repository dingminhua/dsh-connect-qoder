packages:
  - '.'

# 与桌面端捆绑内核同一条依赖线：0.2.2-rc.1（2026-11-05 起）。锁死版本避免 24h
# 供应龄策略干扰（--frozen-lockfile 兜底）。
#
# 为什么从 0.1.7 线上移：主树停在 0.1.7 时，`typecheck` / `test` 从未对着真宿主
# 的声明跑过 —— 0.2.2-rc.1 的四处类型破坏就是这样漏出去的（见
# docs/DSH-0.2.2-RC1-FOLLOWUP.md）。要覆盖 0.1.7 宿主，用 fixture 而不是主树。
minimumReleaseAge: 0

allowBuilds:
  '@google/genai': false
  protobufjs: false

overrides:
  '@deepseek-ai/cordis': 4.1.0
  '@deepseek-ai/dsh-atomic-write': 0.2.2-rc.1
  '@deepseek-ai/dsh-attachment': 0.2.2-rc.1
  '@deepseek-ai/dsh-client-locale': 0.2.2-rc.1
  '@deepseek-ai/dsh-client-ui-primitives': 0.2.2-rc.1
  '@deepseek-ai/dsh-client-ui-renderer': 0.2.2-rc.1
  '@deepseek-ai/dsh-client-ui-settings': 0.2.2-rc.1
  '@deepseek-ai/dsh-client-ui-settings-plugins': 0.2.2-rc.1
  '@deepseek-ai/dsh-client-ui-slots': 0.2.2-rc.1
  '@deepseek-ai/dsh-home-paths': 0.2.2-rc.1
  '@deepseek-ai/dsh-host-webserver': 0.2.2-rc.1
  '@deepseek-ai/dsh-llm': 0.2.2-rc.1
  '@deepseek-ai/dsh-llm-pi-ai': 0.2.2-rc.1
  '@deepseek-ai/dsh-settings': 0.2.2-rc.1
  '@deepseek-ai/schemastery': 3.19.0
  '@earendil-works/pi-ai': 1.3.0
  # Transitive peers of the 0.2.2 line (published on the next tag).
  # `dsh-invariants` 不再需要：它在 0.2.0-rc.2 之后停版，0.2.2 线没有包再引用它。
  '@deepseek-ai/dsh-brand': 0.2.2-rc.1
  '@deepseek-ai/dsh-timeout': 0.2.2-rc.1
  '@deepseek-ai/dsh-fs': 0.2.2-rc.1
  '@deepseek-ai/dsh-sandbox': 0.2.2-rc.1
  '@deepseek-ai/dsh-scope': 0.2.2-rc.1
  '@deepseek-ai/dsh-session': 0.2.2-rc.1
  '@deepseek-ai/dsh-util-values': 0.2.2-rc.1
  '@deepseek-ai/dsh-util-crypto': 0.2.2-rc.1
  '@deepseek-ai/dsh-typert-protocol': 0.2.2-rc.1
  '@deepseek-ai/dsh-credentials': 0.2.2-rc.1
  '@deepseek-ai/dsh-authorization': 0.2.2-rc.1
  '@deepseek-ai/dsh-launch-environment': 0.2.2-rc.1
